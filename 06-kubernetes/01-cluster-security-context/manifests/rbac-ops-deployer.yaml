apiVersion: v1
kind: ServiceAccount
metadata:
  name: ops-deployer
  namespace: default
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: deployment-manager
  namespace: default
rules:
- apiGroups: ["apps"]
  resources: ["deployments","replicasets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: manage-deployments-binding
  namespace: default
subjects:
- kind: ServiceAccount
  name: ops-deployer
  namespace: default
roleRef:
   kind: Role
   name: deployment-manager
   apiGroup: rbac.authorization.k8s.io
